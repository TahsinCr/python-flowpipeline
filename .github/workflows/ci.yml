name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.14t"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        env:
          PYTHON_GIL: ${{ matrix.python-version == '3.14t' && '0' || '1' }}
        run: python run_tests.py
      - name: Verify free-threaded runtime
        if: matrix.python-version == '3.14t'
        env:
          PYTHON_GIL: "0"
        run: python -c "import sys, flowpipeline; assert not sys._is_gil_enabled()"

  checks:
    name: Lint, types, and distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.10"
      - run: python -m pip install ".[dev]" "build>=1.2,<2" "twine>=6,<7"
      - run: python -m ruff check .
      - run: python -m pyright
      - name: Report Python line and branch coverage
        run: |
          python -m pip install "coverage>=7.6,<8"
          python -m coverage run --branch --source=flowpipeline -m unittest discover -s tests
          python -m coverage report --show-missing --fail-under=90
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - name: Check the installed wheel
        working-directory: ${{ runner.temp }}
        run: python -c "from pathlib import Path; import flowpipeline; assert (Path(flowpipeline.__file__).parent / 'py.typed').is_file()"
